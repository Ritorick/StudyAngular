```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 300px;
            text-align: center;
        }

        .title {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .message {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar {
            width: 0%;
            height: 100%;
            background: #1976d2;
            animation: loading 2.5s ease-in-out forwards;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            30% {
                width: 35%;
            }

            60% {
                width: 65%;
            }

            85% {
                width: 85%;
            }

            100% {
                width: 95%;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="title">Hello World App</div>

    <div class="message">
        起動しています...
    </div>

    <div class="progress">
        <div class="bar"></div>
    </div>
</div>

</body>
</html>
